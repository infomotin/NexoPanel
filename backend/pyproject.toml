[project]
name = "nexopanel"
version = "1.0.0"
description = "Production-grade Linux web hosting control panel"
readme = "../README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[project.urls]
Repository = "https://github.com/infomotin/NexoPanel"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",
    "pydantic>=2.9.0",
    "email-validator>=2.2.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.3",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
    "cryptography>=43.0.0",
    "pyotp>=2.9.0",
    "qrcode[pil]>=8.0",
    "jinja2>=3.1.4",
    "psutil>=6.1.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.2",
    "dnspython>=2.7.0",
    "acme>=2.11.0",
    "passlib>=1.7.4",
    "apscheduler>=3.10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
